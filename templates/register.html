
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<body class="auth-page"></body>
<button type="button" id="theme-toggle" class="theme-toggle">
    🌙 Dark mode
</button>

    <main>
        <h1>Create an account</h1>
        <p>Register to start managing your tasks.</p>

        <div id="errors" role="alert" aria-live="polite">
            {% for error in errors %}
                <p>{{ error }}</p>
            {% endfor %}
        </div>

        <form id="register-form"
              action="{{ url_for('register') }}"
              method="POST"
              novalidate>

            <div>
                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    maxlength="100"
                    value="{{ values.name }}"
                    autocomplete="name"
                >
            </div>

            <div>
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    maxlength="255"
                    value="{{ values.email }}"
                    autocomplete="email"
                >
            </div>

            <div>
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="new-password"
                >
            </div>

            <div>
                <label for="confirm_password">Confirm password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    autocomplete="new-password"
                >
            </div>

            <button type="submit">Create account</button>
        </form>

        <p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
    </main>

    <script>
        const form = document.getElementById("register-form");
        const errorsBox = document.getElementById("errors");

        form.addEventListener("submit", function (event) {
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword =
                document.getElementById("confirm_password").value;

            const errors = [];

            if (!name) errors.push("Name is required");
            if (!email) errors.push("Email is required");
            if (!password) errors.push("Password is required");
            if (!confirmPassword) {
                errors.push("Confirm password is required");
            }

            if (
                password &&
                confirmPassword &&
                password !== confirmPassword
            ) {
                errors.push("Passwords do not match");
            }

            if (name.length > 100) {
                errors.push("Name must be at most 100 characters");
            }

            if (email.length > 255) {
                errors.push("Email must be at most 255 characters");
            }

            if (new TextEncoder().encode(password).length > 72) {
                errors.push("Password must be at most 72 bytes");
            }

            errorsBox.replaceChildren();

            if (errors.length > 0) {
                event.preventDefault();

                errors.forEach(function (message) {
                    const p = document.createElement("p");
                    p.textContent = message;
                    errorsBox.appendChild(p);
                });
            }
        });
    </script>
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</body>
</html>
